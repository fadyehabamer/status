status-website:
  # No custom domain: served from https://fadyehabamer.github.io/status/
  baseUrl: /status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Fady Amer — Status
  introTitle: "Live status of Fady Amer's sites, apps and the APIs they use."
  introMessage: Checked every 5 minutes by GitHub Actions. Outages open an issue in this [repository](https://github.com/fadyehabamer/status) and close automatically on recovery.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime's recommended default schedule (public repo, so Actions minutes are free)
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"
